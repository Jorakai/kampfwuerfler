<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <meta name="description" content="Schneller, flexibler Kampfwürfler für Rollenspielrunden">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Kampfwürfler</title>
  <style>
    :root{--bg:#0c1016;--panel:#181f2a;--panel2:#222b39;--line:#354157;--text:#f4f6f9;--muted:#aeb7c6;--gold:#e4b94b;--red:#ff7070;--green:#70d99b}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(155deg,#0b0f15,#151b25 72%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input,select{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(94px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:5;background:#0c1016ef;backdrop-filter:blur(12px);padding:14px 1px 10px;border-bottom:1px solid var(--line)}
    h1{font-size:1.25rem;margin:0}.subtitle,.detail,label{color:var(--muted);font-size:.84rem}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{background:#283244;border:1px solid #3a465c;border-radius:999px;padding:7px 11px;font-weight:850;white-space:nowrap}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.tab,.btn{border:0;border-radius:12px;padding:11px 7px;font-weight:850}.tab{background:#232b39;color:var(--muted)}.tab.active,.primary{background:var(--gold);color:#181206}
    .view{display:none;padding-top:14px}.view.active{display:block}.card{background:#181f2af2;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 25px #0003}
    select,input{width:100%;background:#0e141c;color:var(--text);border:1px solid #3a465c;border-radius:10px;padding:11px;margin-top:5px}.split{display:grid;gap:12px}
    .result{min-height:185px;display:flex;flex-direction:column;justify-content:center;text-align:center}.cap{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:.74rem;font-weight:850}.formula{color:var(--muted);margin-top:7px}.big{font-size:3.45rem;line-height:1;font-weight:950;margin:10px 0}.damage .big,.gold{color:var(--gold)}
    .fail{border-color:#7a404a;background:#291b21}.fail .big{color:var(--red)}.crit{border-color:#8a6d28;background:#2a2517}.invalid{text-decoration:line-through;opacity:.58}.hidden{display:none!important}
    .bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#090d12f5;border-top:1px solid var(--line);padding:10px max(14px,calc((100vw - 720px)/2 + 14px)) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr;gap:8px}.secondary{background:#293345;color:var(--text)}.danger{background:#583038;color:#fff}
    .notice{background:#242d3c;border-left:4px solid var(--gold);padding:10px 12px;border-radius:9px;font-size:.86rem;color:#dce2ed}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .switchline{display:flex;align-items:center;gap:9px;margin:12px 0}.switchline input{width:auto;margin:0}.history{border-left:4px solid #63728a}.history.bad{border-left-color:var(--red)}.history.critical{border-left-color:var(--gold)}.histhead{display:flex;justify-content:space-between;gap:8px}.empty{text-align:center;color:var(--muted);padding:30px 10px}
    .edit{background:#222a38;border:1px solid #313c50;border-radius:13px;padding:12px;margin:10px 0}.quickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.diebtn{border:1px solid #46536c;background:#252e3d;color:#fff;border-radius:14px;padding:18px 5px;font-weight:900}.quickresult{text-align:center;color:var(--gold);font-size:3rem;font-weight:950;min-height:85px;padding:13px}
    @media(min-width:610px){.split{grid-template-columns:1fr 1fr}.result{min-height:260px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="head">
      <div><h1>⚔️ Kampfwürfler</h1><div class="subtitle">Kaelira · Testversion</div></div>
      <div class="counter">Würfe: <span id="counter">0</span></div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="fight">Kampf</button>
      <button class="tab" data-view="quick">Würfel</button>
      <button class="tab" data-view="history">Historie</button>
      <button class="tab" data-view="settings">Werte</button>
    </nav>
  </header>

  <section id="fight" class="view active">
    <div class="card">
      <label>Angriff<select id="attackSelect"></select></label>
      <div class="head" style="margin-top:12px"><b id="attackName"></b><span class="counter" id="position"></span></div>
    </div>
    <div class="notice" id="optionNotice"></div>
    <div class="split" style="margin-top:12px">
      <div class="card result" id="attackCard">
        <div class="cap">Angriffswurf</div><div class="formula" id="attackFormula"></div>
        <div class="big" id="attackResult">–</div><div class="detail" id="attackDetail">Noch nicht gewürfelt</div>
      </div>
      <div class="card result damage" id="damageCard">
        <div class="cap">Schaden</div><div class="formula" id="damageFormula"></div>
        <div class="big" id="damageResult">–</div><div class="detail" id="damageDetail">Noch nicht gewürfelt</div>
      </div>
    </div>
    <div class="card hidden" id="criticalCard">
      <div class="cap">Kritische Bestätigung</div><h2 id="confirmationResult"></h2><div class="detail" id="confirmationDetail"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
      <div class="cap">Möglicher kritischer Schaden</div><h1 class="gold" id="criticalDamage"></h1><div class="detail" id="criticalDetail"></div>
    </div>
  </section>

  <section id="quick" class="view">
    <div class="card"><div class="cap">Schnellwürfel</div><div class="quickresult" id="quickResult">–</div><div class="quickgrid" id="quickGrid"></div></div>
  </section>

  <section id="history" class="view">
    <div class="row"><button class="btn secondary" id="exportButton">Sicherung exportieren</button><button class="btn danger" id="clearHistory">Historie löschen</button></div>
    <div id="historyList"></div>
  </section>

  <section id="settings" class="view">
    <div class="card">
      <h3>Kampfoptionen</h3>
      <label class="switchline"><input type="checkbox" id="expertiseEnabled"> Kampfsachkenntnis aktiv</label>
      <label>Wert (0–5)<input type="number" min="0" max="5" id="expertiseValue"></label>
      <label class="switchline"><input type="checkbox" id="powerEnabled"> Kraftangriff aktiv</label>
      <label>Wert (0–5)<input type="number" min="0" max="5" id="powerValue"></label>
    </div>
    <div class="card">
      <h3>Angriffe bearbeiten</h3><div id="attackEditors"></div>
      <button class="btn secondary" style="width:100%" id="addAttack">+ Angriff hinzufügen</button>
    </div>
    <div class="card">
      <h3>Daten</h3>
      <label>Sicherung importieren<input type="file" accept=".json,application/json" id="importFile"></label>
      <button class="btn danger" style="width:100%;margin-top:12px" id="resetAll">Alle Testdaten zurücksetzen</button>
    </div>
  </section>
</div>

<div class="bar" id="fightBar">
  <button class="btn secondary" id="resetCounter">Counter 0</button>
  <button class="btn primary" id="rollAttack">Angriff würfeln</button>
</div>

<script>
(function(){
  'use strict';
  var STORAGE_KEY='kampfwuerfler_v1';
  var DEFAULTS={counter:0,currentAttack:0,advanceBeforeRoll:false,history:[],expertiseEnabled:true,expertiseValue:5,powerEnabled:true,powerValue:5,attacks:[
    {name:'1. Angriff',baseAttack:76,diceCount:4,diceSides:12,baseDamage:19,criticalMultiplier:2},
    {name:'2. Angriff',baseAttack:76,diceCount:4,diceSides:12,baseDamage:19,criticalMultiplier:2},
    {name:'3. Angriff',baseAttack:66,diceCount:4,diceSides:12,baseDamage:19,criticalMultiplier:2},
    {name:'4. Angriff',baseAttack:76,diceCount:4,diceSides:12,baseDamage:19,criticalMultiplier:2},
    {name:'5. Angriff',baseAttack:76,diceCount:4,diceSides:12,baseDamage:19,criticalMultiplier:2},
    {name:'6. Angriff',baseAttack:72,diceCount:4,diceSides:12,baseDamage:17,criticalMultiplier:2}
  ]};
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function load(){try{var x=JSON.parse(localStorage.getItem(STORAGE_KEY));return x&&x.attacks&&x.attacks.length?x:clone(DEFAULTS)}catch(err){return clone(DEFAULTS)}}
  var state=load();
  function el(id){return document.getElementById(id)}
  function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
  function randomDie(sides){var bucket=new Uint32Array(1);crypto.getRandomValues(bucket);return bucket[0]%sides+1}
  function rollDice(count,sides){var rolls=[],sum=0;for(var i=0;i<count;i++){var value=randomDie(sides);rolls.push(value);sum+=value}return{rolls:rolls,sum:sum}}
  function signed(value){return value>=0?'+ '+value:'− '+Math.abs(value)}
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function current(){
    if(state.currentAttack>=state.attacks.length)state.currentAttack=0;
    var attack=state.attacks[state.currentAttack];
    var expertise=state.expertiseEnabled?Number(state.expertiseValue):0;
    var power=state.powerEnabled?Number(state.powerValue):0;
    return{attack:attack,attackBonus:Number(attack.baseAttack)-expertise-power,damageBonus:Number(attack.baseDamage)+power,expertise:expertise,power:power}
  }
  function renderFight(){
    var value=current(),attack=value.attack;
    el('counter').textContent=state.counter;
    el('attackSelect').innerHTML=state.attacks.map(function(item,index){return'<option value="'+index+'">'+escapeHtml(item.name)+'</option>'}).join('');
    el('attackSelect').value=state.currentAttack;
    el('attackName').textContent=attack.name;
    el('position').textContent=(state.currentAttack+1)+' von '+state.attacks.length;
    el('attackFormula').textContent='1W20 '+signed(value.attackBonus);
    el('damageFormula').textContent=attack.diceCount+'W'+attack.diceSides+' '+signed(value.damageBonus);
    var options=[];
    if(value.expertise)options.push('Kampfsachkenntnis '+value.expertise+' · Verteidigung +'+value.expertise);
    if(value.power)options.push('Kraftangriff '+value.power);
    el('optionNotice').textContent=options.length?options.join(' | '):'Keine Kampfoption aktiv';
  }
  function clearResults(){
    el('attackResult').textContent='–';el('damageResult').textContent='–';
    el('attackDetail').textContent='Noch nicht gewürfelt';el('damageDetail').textContent='Noch nicht gewürfelt';
    el('attackCard').className='card result';el('damageCard').className='card result damage';
    el('criticalCard').classList.add('hidden');
  }
  function performAttack(){
    if(state.advanceBeforeRoll){state.currentAttack=(state.currentAttack+1)%state.attacks.length}
    var value=current(),attack=value.attack;
    var natural=randomDie(20),attackTotal=natural+value.attackBonus;
    var damageRoll=rollDice(Number(attack.diceCount),Number(attack.diceSides));
    var damageTotal=damageRoll.sum+value.damageBonus;
    var entry={time:Date.now(),name:attack.name,natural:natural,attackBonus:value.attackBonus,attackTotal:attackTotal,damageRolls:damageRoll.rolls,damageBonus:value.damageBonus,damageTotal:damageTotal,status:'normal'};
    state.counter++;
    el('attackResult').textContent=attackTotal;
    el('attackDetail').textContent='W20: '+natural+' '+signed(value.attackBonus);
    el('damageResult').textContent=damageTotal;
    el('damageDetail').classList.remove('invalid');
    el('damageDetail').textContent=damageRoll.rolls.join(' + ')+' '+signed(value.damageBonus);
    el('attackCard').className='card result';el('damageCard').className='card result damage';el('criticalCard').classList.add('hidden');
    if(natural===1){
      entry.status='bad';el('attackCard').classList.add('fail');el('damageCard').classList.add('fail');
      el('attackDetail').textContent='Natürliche 1 – automatischer Fehlschlag';
      el('damageDetail').textContent+=' · Schaden ungültig';el('damageDetail').classList.add('invalid');
    }else if(natural===20){
      entry.status='critical';el('attackCard').classList.add('crit');
      el('attackDetail').textContent='Natürliche 20 – automatischer Treffer';
      var confirmationNatural=randomDie(20),confirmationTotal=confirmationNatural+value.attackBonus;
      var multiplier=Number(attack.criticalMultiplier)||2;
      var criticalRoll=rollDice(Number(attack.diceCount)*multiplier,Number(attack.diceSides));
      var criticalTotal=criticalRoll.sum+value.damageBonus*multiplier;
      entry.confirmationNatural=confirmationNatural;entry.confirmationTotal=confirmationTotal;
      entry.criticalRolls=criticalRoll.rolls;entry.criticalTotal=criticalTotal;
      el('confirmationResult').textContent='1W20 '+signed(value.attackBonus)+' → '+confirmationTotal;
      el('confirmationDetail').textContent='W20: '+confirmationNatural+' · Muss die gegnerische Verteidigung treffen.';
      el('criticalDamage').textContent=criticalTotal;
      el('criticalDetail').textContent=(Number(attack.diceCount)*multiplier)+'W'+attack.diceSides+' '+signed(value.damageBonus*multiplier)+' · Würfel: '+criticalRoll.rolls.join(', ');
      el('criticalCard').classList.remove('hidden');
    }
    state.history.unshift(entry);if(state.history.length>300)state.history.length=300;
    state.advanceBeforeRoll=true;
    save();renderFight();
  }
  function renderHistory(){
    var host=el('historyList');
    if(!state.history.length){host.innerHTML='<div class="card empty">Noch keine Würfe gespeichert.</div>';return}
    host.innerHTML=state.history.map(function(item){
      var critical=item.confirmationTotal!=null?'<p class="gold">Bestätigung: '+item.confirmationTotal+' (W20: '+item.confirmationNatural+')<br>Möglicher kritischer Schaden: <b>'+item.criticalTotal+'</b></p>':'';
      return'<div class="card history '+item.status+'"><div class="histhead"><b>'+escapeHtml(item.name)+'</b><span class="detail">'+new Date(item.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</span></div><p>Angriff: <b>'+item.attackTotal+'</b> (W20: '+item.natural+' '+signed(item.attackBonus)+')</p><p>Schaden: <b>'+item.damageTotal+'</b> ('+item.damageRolls.join(', ')+' '+signed(item.damageBonus)+')</p>'+critical+'</div>';
    }).join('');
  }
  function renderSettings(){
    el('expertiseEnabled').checked=state.expertiseEnabled;el('expertiseValue').value=state.expertiseValue;
    el('powerEnabled').checked=state.powerEnabled;el('powerValue').value=state.powerValue;
    var host=el('attackEditors');host.innerHTML='';
    state.attacks.forEach(function(attack,index){
      var box=document.createElement('div');box.className='edit';
      box.innerHTML='<label>Name<input class="editName" value="'+escapeHtml(attack.name)+'"></label><div class="grid2"><label>Grund-Angriff<input class="editAttack" type="number" value="'+attack.baseAttack+'"></label><label>Grund-Schaden<input class="editDamage" type="number" value="'+attack.baseDamage+'"></label><label>Würfelanzahl<input class="editCount" type="number" min="1" value="'+attack.diceCount+'"></label><label>Würfelseiten<input class="editSides" type="number" min="2" value="'+attack.diceSides+'"></label></div><button class="btn danger deleteAttack" style="margin-top:9px">Angriff löschen</button>';
      function update(){
        attack.name=box.querySelector('.editName').value||('Angriff '+(index+1));
        attack.baseAttack=Number(box.querySelector('.editAttack').value)||0;
        attack.baseDamage=Number(box.querySelector('.editDamage').value)||0;
        attack.diceCount=Math.max(1,Number(box.querySelector('.editCount').value)||1);
        attack.diceSides=Math.max(2,Number(box.querySelector('.editSides').value)||6);
        save();renderFight();
      }
      box.querySelectorAll('input').forEach(function(input){input.addEventListener('change',update)});
      box.querySelector('.deleteAttack').onclick=function(){
        if(state.attacks.length===1){alert('Mindestens ein Angriff muss bestehen bleiben.');return}
        state.attacks.splice(index,1);state.currentAttack=0;state.advanceBeforeRoll=false;save();renderAll();clearResults();
      };
      host.appendChild(box);
    });
  }
  function renderAll(){renderFight();renderHistory();renderSettings()}
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.onclick=function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
      document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});
      tab.classList.add('active');el(tab.dataset.view).classList.add('active');
      el('fightBar').classList.toggle('hidden',tab.dataset.view!=='fight');
      if(tab.dataset.view==='history')renderHistory();if(tab.dataset.view==='settings')renderSettings();
    };
  });
  el('rollAttack').onclick=performAttack;
  el('attackSelect').onchange=function(){state.currentAttack=Number(this.value);state.advanceBeforeRoll=false;save();renderFight();clearResults()};
  el('resetCounter').onclick=function(){if(confirm('Angriffscounter auf 0 setzen?')){state.counter=0;save();renderFight()}};
  el('expertiseEnabled').onchange=function(){state.expertiseEnabled=this.checked;save();renderFight()};
  el('powerEnabled').onchange=function(){state.powerEnabled=this.checked;save();renderFight()};
  el('expertiseValue').onchange=function(){state.expertiseValue=Math.max(0,Math.min(5,Number(this.value)||0));save();renderAll()};
  el('powerValue').onchange=function(){state.powerValue=Math.max(0,Math.min(5,Number(this.value)||0));save();renderAll()};
  el('addAttack').onclick=function(){state.attacks.push({name:'Neuer Angriff',baseAttack:0,diceCount:1,diceSides:6,baseDamage:0,criticalMultiplier:2});state.currentAttack=state.attacks.length-1;state.advanceBeforeRoll=false;save();renderAll();clearResults()};
  el('clearHistory').onclick=function(){if(confirm('Gesamte Historie löschen?')){state.history=[];save();renderHistory()}};
  el('resetAll').onclick=function(){if(confirm('Alle Änderungen, Würfe und die Historie löschen?')){state=clone(DEFAULTS);save();renderAll();clearResults()}};
  el('exportButton').onclick=function(){var url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));var link=document.createElement('a');link.href=url;link.download='kampfwuerfler-sicherung.json';link.click();setTimeout(function(){URL.revokeObjectURL(url)},500)};
  el('importFile').onchange=function(){var file=this.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var imported=JSON.parse(reader.result);if(!imported.attacks||!imported.attacks.length)throw new Error();state=imported;save();renderAll();clearResults();alert('Sicherung wurde importiert.')}catch(err){alert('Diese Sicherungsdatei ist ungültig.')}};reader.readAsText(file)};
  [4,6,8,10,12,20,100].forEach(function(sides){var button=document.createElement('button');button.className='diebtn';button.textContent='W'+sides;button.onclick=function(){el('quickResult').textContent='W'+sides+': '+randomDie(sides)};el('quickGrid').appendChild(button)});
  renderAll();clearResults();
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js')})}
})();
</script>
</body>
</html>
